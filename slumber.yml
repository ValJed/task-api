# For basic usage info, see:
# https://slumber.lucaspickering.me/book/getting_started.html
# For all collection options, see:
# https://slumber.lucaspickering.me/book/api/request_collection/index.html

# Profiles are groups of data you can easily switch between. A common usage is
# to define profiles for various environments of a REST service
profiles:
  example:
    name: Example Profile
    data:
      host: http://localhost:3000

# Chains allow you to use dynamic data in your request templates
chains:
  token:
    source: !env
      variable: API_KEY
    sensitive: false

requests:
  get_tasks: !request
    name: Get Tasks
    method: GET
    url: "{{host}}/task"
    headers:
      Accept: application/json
      authorization: "{{chains.token}}"
  get_task_active: !request
    name: Get Task Active
    method: GET
    url: "{{host}}/task?active=true"
    headers:
      Accept: application/json
      authorization: "{{chains.token}}"
  get_contexts: !request
    name: Get Contexts
    method: GET
    url: "{{host}}/context"
    headers:
      Accept: application/json
      authorization: "{{chains.token}}"
  post_context: !request
    name: Post Context
    method: POST
    url: "{{host}}/context"
    headers:
      Accept: application/json
      authorization: "{{chains.token}}"

